<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071520">
<title>Teste os agentes | Otimiza Aí</title>
<link rel="icon" href="/otimiza-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#071520;--bg-2:#0c1f2e;--bg-3:#10293c;--line:#1a3347;--ink:#fff;--muted:#8fa6b8;--accent:#3ab0dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:40px 16px 24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.brand img{width:34px;height:34px;border-radius:8px}
.brand span{font-weight:600;letter-spacing:.2px}
h1{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:600}
.lead{color:var(--muted);margin:0 0 28px;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.nicho{display:flex;flex-direction:column;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:18px;color:inherit;text-decoration:none;transition:border-color .15s}
.nicho:hover{border-color:var(--accent)}
.nicho b{font-size:17px;font-weight:600}
.nicho span{color:var(--muted);font-size:14px}
.nicho em{margin-top:8px;font-style:normal;color:var(--accent);font-weight:600;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/otimiza-icone.png" alt=""><span>Otimiza Aí</span></div>
  <h1>Converse com um agente de verdade</h1>
  <p class="lead">Escolha um segmento e simule o atendimento no WhatsApp, como se fosse o seu cliente falando.</p>
  <div class="grid" id="lista"></div>
</main>
<footer>Otimiza Aí &middot; otimizai.net.br</footer>
<script>
  // Para incluir um segmento novo, basta acrescentar uma linha aqui e criar a pasta com a página dele.
  var NICHOS = [
    { href: '/costacunha/?t=6b2e52cde7bfdbee8a9a8f0237e5a654', nome: 'Advocacia', desc: 'Atendimento de um escritório de advocacia previdenciária.' }
  ];
  var el = document.getElementById('lista');
  NICHOS.forEach(function (n) {
    var a = document.createElement('a'); a.className = 'nicho'; a.href = n.href;
    var b = document.createElement('b'); b.textContent = n.nome;
    var d = document.createElement('span'); d.textContent = n.desc;
    var e = document.createElement('em'); e.textContent = 'Testar agora';
    a.appendChild(b); a.appendChild(d); a.appendChild(e); el.appendChild(a);
  });
</script>
</body>
</html>
